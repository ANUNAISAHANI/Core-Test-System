<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTest System - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon_clean.png') }}">
</head>
<body>
    <div class="bg-eyes-wrapper">
    <!-- 👁️ Left Eye Container (Perfect Leaf Shape) -->
    <div class="bg-eye-container left">
        <svg class="eye-svg" viewBox="0 0 500 250">
            <defs>
                <radialGradient id="leftIrisGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" class="core-white" stop-color="#ffffff" />
                    <stop offset="15%" class="core-highlight" stop-color="#ffffff" />
                    <stop offset="60%" class="neon-main" stop-color="#00d2d3" />
                    <stop offset="85%" class="neon-dark" stop-color="#001f21" />
                    <stop offset="100%" stop-color="#000000" />
                </radialGradient>
                <clipPath id="leftClip">
                    <path d="M 30,125 C 120,30 380,30 470,125 C 380,220 120,220 30,125 Z" />
                </clipPath>
            </defs>
            <path class="eye-bg-shadow" d="M 30,125 C 120,30 380,30 470,125 C 380,220 120,220 30,125 Z" />
            
            <g clip-path="url(#leftClip)">
                <g class="iris-movement-group">
                    <circle cx="250" cy="125" r="115" fill="url(#leftIrisGlow)" />
                    <circle cx="250" cy="125" r="30" fill="#000000" />
                    <circle cx="235" cy="110" r="8" fill="#ffffff" opacity="0.85" />
                </g>
            </g>
            <path class="eye-lid" d="M 30,125 C 120,30 380,30 470,125 C 380,220 120,220 30,125 Z" />
        </svg>
    </div>
    
    <!-- 👁️ Right Eye Container (Exact Same Mirror Leaf Shape) -->
    <div class="bg-eye-container right">
        <svg class="eye-svg" viewBox="0 0 500 250">
            <defs>
                <radialGradient id="rightIrisGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" class="core-white" stop-color="#ffffff" />
                    <stop offset="15%" class="core-highlight" stop-color="#ffffff" />
                    <stop offset="60%" class="neon-main" stop-color="#00d2d3" />
                    <stop offset="85%" class="neon-dark" stop-color="#001f21" />
                    <stop offset="100%" stop-color="#000000" />
                </radialGradient>
                <clipPath id="rightClip">
                    <path d="M 30,125 C 120,30 380,30 470,125 C 380,220 120,220 30,125 Z" />
                </clipPath>
            </defs>
            <path class="eye-bg-shadow" d="M 30,125 C 120,30 380,30 470,125 C 380,220 120,220 30,125 Z" />
            
            <g clip-path="url(#rightClip)">
                <g class="iris-movement-group">
                    <circle cx="250" cy="125" r="115" fill="url(#rightIrisGlow)" />
                    <circle cx="250" cy="125" r="30" fill="#000000" />
                    <circle cx="235" cy="110" r="8" fill="#ffffff" opacity="0.85" />
                </g>
            </g>
            <path class="eye-lid" d="M 30,125 C 120,30 380,30 470,125 C 380,220 120,220 30,125 Z" />
        </svg>
    </div>
  </div>

    <!-- Registration Card Form Layout Container -->
    <div class="auth-container">
        <div class="auth-card" id="mainRegisterCard">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Register to start your exam journey</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="rollNumber" placeholder="Enter University Roll Number" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" placeholder="Enter 10-digit number" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create password" required>
                </div>
                
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                
                <div class="form-group">
                     <label>Course & Branch</label>
                     <select id="courseBranch" required>
                         <option value="" disabled selected>-- Select Course & Branch --</option>
                         <option value="B.TECH">B.Tech (Computer Science & Eng.)</option>
                         <option value="BCA">BCA (Comp. Applications)</option>
                         <option value="MCA">MCA (Master of Comp. Applications)</option>
                         <option value="BBA">BBA (Business Administration)</option>
                         <option value="B.COM">B.Com (Commerce)</option>
                         <option value="MBA">MBA (Master of Business Admin.)</option>
                         <option value="BSC.AG">B.Sc (Agriculture)</option>
                         <option value="M.SC AG">M.Sc (Agriculture)</option>
                         <option value="B.PHARM">B.Pharm (Pharmacy)</option>
                         <option value="D.PHARM">D.Pharm (Diploma in Pharmacy)</option>
                         <option value="M.PHARM">M.Pharm (Master of Pharmacy)</option>
                         <option value="M.TECH">M.Tech (Master of Technology)</option>
                         <option value="B.SC NURSING">B.Sc (Nursing)</option>
                         <option value="BSC CS DS">B.Sc (CS & Data Science)</option>
                     </select>
                 </div>

                <div class="form-group">
                    <label>Section</label>
                    <select id="section" required>
                         <option value="" disabled selected>-- Select Section --</option> 
                         <option value="None">None (No Section)</option>
                         <option value="Section-A">Section-A</option>
                         <option value="Section-B">Section-B</option>
                         <option value="Section-C">Section-C</option>
                         <option value="Section-D">Section-D</option>
                         <option value="Section-E">Section-E</option>
                    </select>
                </div>
             
                <div class="form-group">
                       <label class="semester-label">Current Academic Semester</label>
                       <select id="regSemester" required>
                           <option value="">-- Select Your Semester --</option>
                           <option value="Semester-1">Semester-1</option>
                           <option value="Semester-2">Semester-2</option>
                           <option value="Semester-3">Semester-3</option>
                           <option value="Semester-4">Semester-4</option>
                           <option value="Semester-5">Semester-5</option>
                           <option value="Semester-6">Semester-6</option>
                           <option value="Semester-7">Semester-7</option>
                           <option value="Semester-8">Semester-8</option>
                       </select>
                </div>    
                
                <input type="hidden" id="role" value="student">

                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Login</a></p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
